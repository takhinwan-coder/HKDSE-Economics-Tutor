<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title description">
  <title id="title">長期平均成本與規模的三種情況</title>
  <desc id="description">圖表說明長期平均成本隨產量增加而下降、不變或上升時，分別代表規模經濟、規模報酬不變和規模不經濟。</desc>
  <style>
    .heading { fill:#15324b; font:bold 29px 'Microsoft JhengHei',sans-serif; }
    .panel { fill:#15324b; font:bold 21px 'Microsoft JhengHei',sans-serif; }
    .detail { fill:#243247; font:17px 'Microsoft JhengHei',sans-serif; }
    .answer { fill:#167979; font:bold 18px 'Microsoft JhengHei',sans-serif; }
    .axis { stroke:#243247; stroke-width:2.5; }
  </style>
  <rect width="1200" height="690" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="heading">長期：所有投入都可改變，觀察產量增加時的平均成本</text>
  <rect x="25" y="78" width="365" height="490" rx="15" fill="#f2f6f8" stroke="#cbd6df" stroke-width="2"/>
  <text x="48" y="115" class="panel">情況 1：規模經濟</text>
  <line x1="80" y1="395" x2="340" y2="395" class="axis"/><line x1="80" y1="395" x2="80" y2="165" class="axis"/>
  <text x="337" y="422" text-anchor="end" class="detail">產量</text><text x="43" y="285" transform="rotate(-90 43 285)" class="detail">LRAC</text>
  <path d="M90 195 C150 220 230 300 330 360" fill="none" stroke="#168c8c" stroke-width="6"/>
  <path d="M235 300 L295 342" stroke="#e68745" stroke-width="5"/><path d="M295 342 L278 340 M295 342 L285 325" stroke="#e68745" stroke-width="4"/>
  <text x="48" y="452" class="answer">產量增加 → LRAC 下降</text><text x="48" y="486" class="answer">原因例子：可分工、可買專門設備。</text><text x="48" y="520" class="answer">結論：規模經濟。</text>
  <rect x="418" y="78" width="365" height="490" rx="15" fill="#f2f6f8" stroke="#cbd6df" stroke-width="2"/>
  <text x="441" y="115" class="panel">情況 2：規模報酬不變</text>
  <line x1="473" y1="395" x2="733" y2="395" class="axis"/><line x1="473" y1="395" x2="473" y2="165" class="axis"/>
  <text x="730" y="422" text-anchor="end" class="detail">產量</text><text x="436" y="285" transform="rotate(-90 436 285)" class="detail">LRAC</text>
  <path d="M482 285 L723 285" fill="none" stroke="#5e8da6" stroke-width="6"/>
  <text x="441" y="452" class="answer">產量增加 → LRAC 不變</text><text x="441" y="486" class="answer">投入和產量以相同比率增加。</text><text x="441" y="520" class="answer">結論：規模報酬不變。</text>
  <rect x="810" y="78" width="365" height="490" rx="15" fill="#f2f6f8" stroke="#cbd6df" stroke-width="2"/>
  <text x="833" y="115" class="panel">情況 3：規模不經濟</text>
  <line x1="865" y1="395" x2="1125" y2="395" class="axis"/><line x1="865" y1="395" x2="865" y2="165" class="axis"/>
  <text x="1122" y="422" text-anchor="end" class="detail">產量</text><text x="828" y="285" transform="rotate(-90 828 285)" class="detail">LRAC</text>
  <path d="M875 360 C960 315 1030 240 1115 190" fill="none" stroke="#7b5ea7" stroke-width="6"/>
  <path d="M1020 275 L1080 218" stroke="#e68745" stroke-width="5"/><path d="M1080 218 L1063 224 M1080 218 L1075 236" stroke="#e68745" stroke-width="4"/>
  <text x="833" y="452" class="answer">產量增加 → LRAC 上升</text><text x="833" y="486" class="answer">原因例子：管理及溝通困難。</text><text x="833" y="520" class="answer">結論：規模不經濟。</text>
  <rect x="130" y="602" width="940" height="42" rx="10" fill="#eef7f6" stroke="#168c8c" stroke-width="2"/>
  <text x="600" y="630" text-anchor="middle" class="detail">先讀「產量增加後 LRAC 的方向」，再寫原因和名稱；勿只憑曲線看起來像 U 形便猜答案。</text>
</svg>
