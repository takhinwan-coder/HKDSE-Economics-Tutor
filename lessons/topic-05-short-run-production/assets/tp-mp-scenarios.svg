<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title description">
  <title id="title">從總產量曲線判斷邊際產量的四種情況</title>
  <desc id="description">四個圖表說明總產量曲線愈來愈斜、愈來愈平、到達最高點及向下時，邊際產量分別如何改變。</desc>
  <style>
    .heading { fill:#15324b; font:bold 29px 'Microsoft JhengHei',sans-serif; }
    .panel { fill:#15324b; font:bold 21px 'Microsoft JhengHei',sans-serif; }
    .label { fill:#243247; font:bold 18px 'Microsoft JhengHei',sans-serif; }
    .detail { fill:#243247; font:17px 'Microsoft JhengHei',sans-serif; }
    .answer { fill:#167979; font:bold 19px 'Microsoft JhengHei',sans-serif; }
    .axis { stroke:#243247; stroke-width:2.5; }
  </style>
  <rect width="1200" height="920" fill="#fff"/>
  <text x="600" y="45" text-anchor="middle" class="heading">看 TP 曲線的斜率，就能判斷 MP</text>
  <rect x="35" y="75" width="545" height="365" rx="15" fill="#f2f6f8" stroke="#cbd6df" stroke-width="2"/>
  <text x="62" y="112" class="panel">情況 1：TP 向上而且愈來愈斜</text>
  <line x1="88" y1="335" x2="500" y2="335" class="axis"/><line x1="88" y1="335" x2="88" y2="158" class="axis"/>
  <text x="495" y="362" text-anchor="end" class="detail">勞工</text><text x="45" y="245" transform="rotate(-90 45 245)" class="detail">TP</text>
  <path d="M95 330 C190 325 260 300 320 245 C375 195 430 135 490 105" fill="none" stroke="#168c8c" stroke-width="6"/>
  <path d="M180 318 L265 283" stroke="#e68745" stroke-width="5"/><path d="M260 283 L244 280 M260 283 L250 296" stroke="#e68745" stroke-width="4"/>
  <text x="135" y="145" class="detail">斜率變大</text><text x="62" y="400" class="answer">結論：MP 是正數，而且正在上升。</text>
  <rect x="620" y="75" width="545" height="365" rx="15" fill="#f2f6f8" stroke="#cbd6df" stroke-width="2"/>
  <text x="647" y="112" class="panel">情況 2：TP 向上但愈來愈平</text>
  <line x1="673" y1="335" x2="1085" y2="335" class="axis"/><line x1="673" y1="335" x2="673" y2="158" class="axis"/>
  <text x="1080" y="362" text-anchor="end" class="detail">勞工</text><text x="630" y="245" transform="rotate(-90 630 245)" class="detail">TP</text>
  <path d="M680 330 C745 255 810 190 875 155 C940 122 1010 110 1075 108" fill="none" stroke="#168c8c" stroke-width="6"/>
  <path d="M945 121 L1025 113" stroke="#e68745" stroke-width="5"/><path d="M1025 113 L1010 106 M1025 113 L1011 121" stroke="#e68745" stroke-width="4"/>
  <text x="838" y="145" class="detail">斜率變小</text><text x="647" y="400" class="answer">結論：MP 是正數，但正在下降。</text>
  <rect x="35" y="485" width="545" height="365" rx="15" fill="#f2f6f8" stroke="#cbd6df" stroke-width="2"/>
  <text x="62" y="522" class="panel">情況 3：TP 到達最高點</text>
  <line x1="88" y1="745" x2="500" y2="745" class="axis"/><line x1="88" y1="745" x2="88" y2="568" class="axis"/>
  <text x="495" y="772" text-anchor="end" class="detail">勞工</text><text x="45" y="655" transform="rotate(-90 45 655)" class="detail">TP</text>
  <path d="M95 740 C175 650 250 598 305 590 C360 582 405 615 490 705" fill="none" stroke="#168c8c" stroke-width="6"/>
  <line x1="285" y1="590" x2="345" y2="590" stroke="#e68745" stroke-width="5"/>
  <circle cx="315" cy="590" r="7" fill="#e68745"/><text x="332" y="575" class="detail">斜率 = 0</text>
  <text x="62" y="810" class="answer">結論：MP = 0；TP 在此時最高。</text>
  <rect x="620" y="485" width="545" height="365" rx="15" fill="#f2f6f8" stroke="#cbd6df" stroke-width="2"/>
  <text x="647" y="522" class="panel">情況 4：TP 向下</text>
  <line x1="673" y1="745" x2="1085" y2="745" class="axis"/><line x1="673" y1="745" x2="673" y2="568" class="axis"/>
  <text x="1080" y="772" text-anchor="end" class="detail">勞工</text><text x="630" y="655" transform="rotate(-90 630 655)" class="detail">TP</text>
  <path d="M680 740 C755 665 820 603 875 590 C930 578 1005 630 1075 710" fill="none" stroke="#168c8c" stroke-width="6"/>
  <path d="M945 625 L1020 685" stroke="#e68745" stroke-width="5"/><path d="M1020 685 L1004 674 M1020 685 L1013 667" stroke="#e68745" stroke-width="4"/>
  <text x="880" y="575" class="detail">斜率是負數</text><text x="647" y="810" class="answer">結論：MP 是負數；新增勞工令 TP 減少。</text>
  <text x="600" y="892" text-anchor="middle" class="detail">答題次序：先描述 TP 的方向和斜率，再寫出 MP 的正負及變化，避免只背答案。</text>
</svg>
