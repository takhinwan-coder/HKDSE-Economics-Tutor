<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">勞動生產力比較圖</title>
  <desc id="description">比較甲、乙兩間餅店總產量與每名勞工每小時產量，說明總產量較大不一定表示勞動生產力較高。</desc>
  <style>
    .heading { fill: #15324b; font: bold 30px 'Microsoft JhengHei', sans-serif; }
    .label { fill: #15324b; font: bold 22px 'Microsoft JhengHei', sans-serif; }
    .detail { fill: #243247; font: 20px 'Microsoft JhengHei', sans-serif; }
    .small { fill: #243247; font: 18px 'Microsoft JhengHei', sans-serif; }
  </style>
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="600" y="52" text-anchor="middle" class="heading">比較效率時，要看「每名勞工的產量」</text>
  <line x1="145" y1="480" x2="1050" y2="480" stroke="#243247" stroke-width="3"/>
  <line x1="145" y1="110" x2="145" y2="480" stroke="#243247" stroke-width="3"/>
  <text x="1055" y="510" class="label">餅店</text>
  <text x="42" y="300" transform="rotate(-90 42 300)" class="label">每小時總產量（個麵包）</text>
  <line x1="140" y1="405" x2="150" y2="405" stroke="#243247" stroke-width="2"/>
  <line x1="140" y1="330" x2="150" y2="330" stroke="#243247" stroke-width="2"/>
  <line x1="140" y1="255" x2="150" y2="255" stroke="#243247" stroke-width="2"/>
  <line x1="140" y1="180" x2="150" y2="180" stroke="#243247" stroke-width="2"/>
  <text x="103" y="412" class="small">0</text>
  <text x="86" y="337" class="small">50</text>
  <text x="76" y="262" class="small">100</text>
  <text x="76" y="187" class="small">150</text>
  <rect x="315" y="300" width="170" height="180" fill="#168c8c"/>
  <rect x="700" y="255" width="170" height="225" fill="#5e8da6"/>
  <text x="400" y="520" text-anchor="middle" class="label">甲餅店</text>
  <text x="785" y="520" text-anchor="middle" class="label">乙餅店</text>
  <text x="400" y="285" text-anchor="middle" class="detail">120 個</text>
  <text x="785" y="240" text-anchor="middle" class="detail">150 個</text>
  <rect x="190" y="555" width="820" height="52" rx="12" fill="#eef7f6" stroke="#168c8c" stroke-width="2"/>
  <text x="600" y="589" text-anchor="middle" class="detail">甲：120 ÷ 4 = 30 個／人／小時　｜　乙：150 ÷ 6 = 25 個／人／小時　→　甲的勞動生產力較高</text>
</svg>
